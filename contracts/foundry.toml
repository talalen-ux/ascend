[profile.default]
bytecode_hash = "none"
evm_version = "cancun"
ffi = true
fs_permissions = [{access = "read-write", path = ".forge-snapshots/"}]
libs = ["lib"]
out = "out"
src = "src"
solc_version = "0.8.26"
via_ir = true
optimizer = true
optimizer_runs = 200

# Remappings live in remappings.txt for clarity. The lib layout is
# the v4-template setup: uniswap-hooks vendors v4-core + v4-periphery
# at known-working commits.

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
