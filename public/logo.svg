<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" aria-label="ascend">
  <!--
    ascend mark — organic "a + o" ligature in lime green.

    silhouette: a soft, asymmetric blob leaning to the right, with a
    curling tail that wraps under the bottom-left back into the body.
    cutouts: an upright oval (the "o") high in the right shoulder, and
    a small dot inside the curl of the tail.

    the figure is drawn as a single fill path (the outer silhouette
    plus the inner curl described as a sub-path), with the cutouts
    placed on top in the page background colour to read as holes.
  -->
  <path
    fill="#c5ee47"
    fill-rule="evenodd"
    d="
      M 110 18
      C 138 14, 162 32, 168 64
      C 173 96, 158 122, 132 132
      C 116 138, 102 138, 92 134
      C 80 130, 70 122, 64 112
      C 58 100, 60 86, 70 80
      C 80 75, 92 80, 96 92
      C 100 104, 96 116, 84 120
      C 70 124, 56 116, 50 102
      C 44 86, 50 70, 64 60
      C 80 50, 100 50, 110 60
      L 110 96
      C 110 108, 104 116, 92 116
      L 92 116
      C 80 116, 72 108, 72 96
      C 72 84, 80 76, 92 76
      C 102 76, 110 82, 112 92
      L 112 22
      C 112 20, 111 18, 110 18
      Z
      M 134 56
      C 134 50, 130 46, 124 46
      C 118 46, 114 50, 114 60
      L 114 76
      C 114 86, 118 90, 124 90
      C 130 90, 134 86, 134 76
      Z
    "
  />
  <!-- "o" cutout, on top in background colour -->
  <ellipse cx="124" cy="68" rx="10" ry="20" fill="#070708" />
  <!-- inner curl notch on the lower left to echo the reference -->
  <path
    fill="#070708"
    d="
      M 78 108
      C 70 106, 64 100, 66 92
      C 70 84, 80 86, 84 96
      C 86 102, 84 110, 78 108
      Z
    "
  />
</svg>
